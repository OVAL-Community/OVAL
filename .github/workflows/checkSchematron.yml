name: Check Schematron

on:
  pull_request:
  push:
    branches: [ master, '*_develop' ]

jobs:
  checkSchematron:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install tooling dependencies
        run: python3 -m pip install -r tools/requirements.txt
      - name: Audit and test the embedded Schematron rules
        run: make check-schematron
